name: copiar-secretos-qwen

# ONE-SHOT de mantenimiento: copia los secretos de correo de ESTE repo hacia
# Xacox01/qwen_vuelos_rio (mismo dueño) para que los correos funcionen en ambos
# sitios. Los valores viajan cifrados (sealed box con la public key del repo
# destino) y NUNCA se imprimen en el log. Solo el dueño puede dispararlo.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instala pynacl
        run: pip install -q pynacl
      - name: copia secretos a qwen_vuelos_rio (cifrados, sin mostrar valores)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          ALERT_RSA_PRIV: ${{ secrets.ALERT_RSA_PRIV }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python3 copiar_secretos_qwen.py
